<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="googlebot" content="noindex, nofollow">
    <script src="auth-gate.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#b08d57">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Skinconcept">
    <link rel="apple-touch-icon" href="icon.svg">
    <title>Skinconcept Hagner - Preislisten & Treatments</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<button class="menu-toggle">&#9776;</button>
<div class="sidebar-overlay"></div>

<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="page-header">
            <h2>Preislisten & Treatments</h2>
            <p>Behandlungen und Produkte verwalten</p>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('treatments')">Behandlungen</button>
            <button class="tab" onclick="switchTab('products')">Produkte</button>
        </div>

        <!-- TREATMENTS TAB -->
        <div id="tab-treatments">
            <div class="card">
                <div class="card-header">
                    <h3>Behandlungen</h3>
                    <div style="display:flex; gap:8px;">
                        <button class="btn btn-secondary btn-sm" onclick="exportPDF()">PDF Export</button>
                        <button class="btn btn-primary btn-sm" onclick="openTreatmentModal()">+ Neue Behandlung</button>
                    </div>
                </div>

                <!-- Category Filter -->
                <div style="margin-bottom: 16px;">
                    <select id="categoryFilter" onchange="filterTreatments()" style="padding:8px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:14px; background:var(--bg);">
                        <option value="">Alle Kategorien</option>
                    </select>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Behandlung</th>
                                <th>Kategorie</th>
                                <th>Dauer</th>
                                <th>Preis</th>
                                <th>Aktionen</th>
                            </tr>
                        </thead>
                        <tbody id="treatmentsList">
                            <tr><td colspan="5"><div class="loading"><div class="spinner"></div> Lade...</div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- PRODUCTS TAB -->
        <div id="tab-products" style="display:none;">
            <div class="card">
                <div class="card-header">
                    <h3>Produkte</h3>
                    <button class="btn btn-primary btn-sm" onclick="openProductModal()">+ Neues Produkt</button>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Produkt</th>
                                <th>Marke</th>
                                <th>Kategorie</th>
                                <th>Preis</th>
                                <th>Lager</th>
                                <th>Aktionen</th>
                            </tr>
                        </thead>
                        <tbody id="productsList">
                            <tr><td colspan="6"><div class="loading"><div class="spinner"></div> Lade...</div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Treatment Modal -->
<div class="modal-overlay" id="treatmentModal">
    <div class="modal">
        <h3 id="treatmentModalTitle">Neue Behandlung</h3>
        <input type="hidden" id="treatmentId">
        <div class="form-group">
            <label>Name</label>
            <input type="text" id="tName" placeholder="z.B. Noon Premium Facial">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Kategorie</label>
                <input type="text" id="tCategory" list="categorySuggestions" placeholder="z.B. Noon Aesthetics">
                <datalist id="categorySuggestions"></datalist>
            </div>
            <div class="form-group">
                <label>Dauer (Min.)</label>
                <input type="number" id="tDuration" placeholder="60">
            </div>
        </div>
        <div class="form-group">
            <label>Preis (EUR)</label>
            <input type="number" id="tPrice" step="0.01" placeholder="189.00">
        </div>
        <div class="form-group">
            <label>Beschreibung</label>
            <textarea id="tDescription" placeholder="Kurze Beschreibung der Behandlung..."></textarea>
        </div>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn btn-primary" style="flex:1;" onclick="saveTreatment()">Speichern</button>
            <button class="btn btn-secondary" style="flex:1;" onclick="closeModal('treatmentModal')">Abbrechen</button>
        </div>
    </div>
</div>

<!-- Product Modal -->
<div class="modal-overlay" id="productModal">
    <div class="modal">
        <h3 id="productModalTitle">Neues Produkt</h3>
        <input type="hidden" id="productId">
        <div class="form-group">
            <label>Produktname</label>
            <input type="text" id="pName" placeholder="z.B. Advanced Recovery Serum">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Marke</label>
                <input type="text" id="pBrand" list="brandSuggestions" placeholder="z.B. Noon Aesthetics">
                <datalist id="brandSuggestions"></datalist>
            </div>
            <div class="form-group">
                <label>Kategorie</label>
                <input type="text" id="pCategory" placeholder="z.B. Serum">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Preis (EUR)</label>
                <input type="number" id="pPrice" step="0.01" placeholder="149.00">
            </div>
            <div class="form-group">
                <label>Auf Lager</label>
                <select id="pInStock">
                    <option value="true">Ja</option>
                    <option value="false">Nein</option>
                </select>
            </div>
        </div>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn btn-primary" style="flex:1;" onclick="saveProduct()">Speichern</button>
            <button class="btn btn-secondary" style="flex:1;" onclick="closeModal('productModal')">Abbrechen</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<script>
let allTreatments = [];
let allProducts = [];
let allCategories = new Set();
let allBrands = new Set();

// ============ TABS ============
function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('tab-treatments').style.display = tab === 'treatments' ? 'block' : 'none';
    document.getElementById('tab-products').style.display = tab === 'products' ? 'block' : 'none';
}

// ============ TREATMENTS ============
async function loadTreatments() {
    const snap = await db.collection('treatments').orderBy('category').orderBy('sortOrder').get();
    allTreatments = [];
    allCategories = new Set();
    snap.forEach(doc => {
        const data = { id: doc.id, ...doc.data() };
        allTreatments.push(data);
        if (data.category) allCategories.add(data.category);
    });

    // Update category filter & datalist
    const filter = document.getElementById('categoryFilter');
    const current = filter.value;
    filter.innerHTML = '<option value="">Alle Kategorien</option>' +
        [...allCategories].sort().map(c => `<option value="${c}">${c}</option>`).join('');
    filter.value = current;

    document.getElementById('categorySuggestions').innerHTML =
        [...allCategories].map(c => `<option value="${c}">`).join('');

    renderTreatments();
}

function filterTreatments() {
    renderTreatments();
}

function renderTreatments() {
    const filter = document.getElementById('categoryFilter').value;
    const filtered = filter ? allTreatments.filter(t => t.category === filter) : allTreatments;
    const tbody = document.getElementById('treatmentsList');

    if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><p>Noch keine Behandlungen angelegt.</p></div></td></tr>';
        return;
    }

    tbody.innerHTML = filtered.map(t => `
        <tr>
            <td>
                <strong>${t.name}</strong>
                ${t.description ? `<br><small style="color:var(--text-light)">${t.description}</small>` : ''}
            </td>
            <td><span class="badge badge-aktiv">${t.category || '-'}</span></td>
            <td>${t.duration ? t.duration + ' Min.' : '-'}</td>
            <td><strong>${formatCurrency(t.price || 0)}</strong></td>
            <td>
                <button class="btn btn-secondary btn-sm" onclick="editTreatment('${t.id}')">Bearbeiten</button>
                <button class="btn btn-sm" style="color:var(--danger);background:none;padding:6px 8px;" onclick="deleteTreatment('${t.id}', '${t.name}')">&#10005;</button>
            </td>
        </tr>
    `).join('');
}

function openTreatmentModal() {
    document.getElementById('treatmentModalTitle').textContent = 'Neue Behandlung';
    document.getElementById('treatmentId').value = '';
    document.getElementById('tName').value = '';
    document.getElementById('tCategory').value = '';
    document.getElementById('tDuration').value = '';
    document.getElementById('tPrice').value = '';
    document.getElementById('tDescription').value = '';
    document.getElementById('treatmentModal').classList.add('active');
}

function editTreatment(id) {
    const t = allTreatments.find(x => x.id === id);
    if (!t) return;
    document.getElementById('treatmentModalTitle').textContent = 'Behandlung bearbeiten';
    document.getElementById('treatmentId').value = id;
    document.getElementById('tName').value = t.name || '';
    document.getElementById('tCategory').value = t.category || '';
    document.getElementById('tDuration').value = t.duration || '';
    document.getElementById('tPrice').value = t.price || '';
    document.getElementById('tDescription').value = t.description || '';
    document.getElementById('treatmentModal').classList.add('active');
}

async function saveTreatment() {
    const id = document.getElementById('treatmentId').value;
    const data = {
        name: document.getElementById('tName').value.trim(),
        category: document.getElementById('tCategory').value.trim(),
        duration: Number(document.getElementById('tDuration').value) || 0,
        price: Number(document.getElementById('tPrice').value) || 0,
        description: document.getElementById('tDescription').value.trim(),
        active: true,
        sortOrder: 0
    };

    if (!data.name) { showToast('Bitte Name eingeben', 'error'); return; }

    try {
        if (id) {
            await db.collection('treatments').doc(id).update(data);
            showToast('Behandlung aktualisiert', 'success');
        } else {
            data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
            await db.collection('treatments').add(data);
            showToast('Behandlung gespeichert', 'success');
        }
        closeModal('treatmentModal');
        loadTreatments();
    } catch (err) {
        console.error(err);
        showToast('Fehler beim Speichern', 'error');
    }
}

async function deleteTreatment(id, name) {
    if (!confirm(`"${name}" wirklich loeschen?`)) return;
    try {
        await db.collection('treatments').doc(id).delete();
        showToast('Behandlung geloescht', 'success');
        loadTreatments();
    } catch (err) {
        showToast('Fehler beim Loeschen', 'error');
    }
}

// ============ PRODUCTS ============
async function loadProducts() {
    const snap = await db.collection('products').orderBy('brand').get();
    allProducts = [];
    allBrands = new Set();
    snap.forEach(doc => {
        const data = { id: doc.id, ...doc.data() };
        allProducts.push(data);
        if (data.brand) allBrands.add(data.brand);
    });

    document.getElementById('brandSuggestions').innerHTML =
        [...allBrands].map(b => `<option value="${b}">`).join('');

    renderProducts();
}

function renderProducts() {
    const tbody = document.getElementById('productsList');
    if (allProducts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><p>Noch keine Produkte angelegt.</p></div></td></tr>';
        return;
    }

    tbody.innerHTML = allProducts.map(p => `
        <tr>
            <td><strong>${p.name}</strong></td>
            <td>${p.brand || '-'}</td>
            <td>${p.category || '-'}</td>
            <td><strong>${formatCurrency(p.price || 0)}</strong></td>
            <td>${p.inStock !== false ? '<span class="badge badge-aktiv">Ja</span>' : '<span class="badge badge-entwurf">Nein</span>'}</td>
            <td>
                <button class="btn btn-secondary btn-sm" onclick="editProduct('${p.id}')">Bearbeiten</button>
                <button class="btn btn-sm" style="color:var(--danger);background:none;padding:6px 8px;" onclick="deleteProduct('${p.id}', '${p.name}')">&#10005;</button>
            </td>
        </tr>
    `).join('');
}

function openProductModal() {
    document.getElementById('productModalTitle').textContent = 'Neues Produkt';
    document.getElementById('productId').value = '';
    document.getElementById('pName').value = '';
    document.getElementById('pBrand').value = '';
    document.getElementById('pCategory').value = '';
    document.getElementById('pPrice').value = '';
    document.getElementById('pInStock').value = 'true';
    document.getElementById('productModal').classList.add('active');
}

function editProduct(id) {
    const p = allProducts.find(x => x.id === id);
    if (!p) return;
    document.getElementById('productModalTitle').textContent = 'Produkt bearbeiten';
    document.getElementById('productId').value = id;
    document.getElementById('pName').value = p.name || '';
    document.getElementById('pBrand').value = p.brand || '';
    document.getElementById('pCategory').value = p.category || '';
    document.getElementById('pPrice').value = p.price || '';
    document.getElementById('pInStock').value = p.inStock !== false ? 'true' : 'false';
    document.getElementById('productModal').classList.add('active');
}

async function saveProduct() {
    const id = document.getElementById('productId').value;
    const data = {
        name: document.getElementById('pName').value.trim(),
        brand: document.getElementById('pBrand').value.trim(),
        category: document.getElementById('pCategory').value.trim(),
        price: Number(document.getElementById('pPrice').value) || 0,
        inStock: document.getElementById('pInStock').value === 'true'
    };

    if (!data.name) { showToast('Bitte Produktname eingeben', 'error'); return; }

    try {
        if (id) {
            await db.collection('products').doc(id).update(data);
            showToast('Produkt aktualisiert', 'success');
        } else {
            data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
            await db.collection('products').add(data);
            showToast('Produkt gespeichert', 'success');
        }
        closeModal('productModal');
        loadProducts();
    } catch (err) {
        console.error(err);
        showToast('Fehler beim Speichern', 'error');
    }
}

async function deleteProduct(id, name) {
    if (!confirm(`"${name}" wirklich loeschen?`)) return;
    try {
        await db.collection('products').doc(id).delete();
        showToast('Produkt geloescht', 'success');
        loadProducts();
    } catch (err) {
        showToast('Fehler beim Loeschen', 'error');
    }
}

// ============ MODAL ============
function closeModal(id) {
    document.getElementById(id).classList.remove('active');
}

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.remove('active');
    });
});

// ============ PDF EXPORT ============
function exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(20);
    doc.text('SKINCONCEPT HAGNER', 105, 20, { align: 'center' });
    doc.setFontSize(12);
    doc.setTextColor(120);
    doc.text('Preisliste', 105, 28, { align: 'center' });
    doc.setTextColor(0);

    let y = 40;
    let currentCategory = '';

    allTreatments.forEach(t => {
        if (y > 270) {
            doc.addPage();
            y = 20;
        }

        if (t.category !== currentCategory) {
            currentCategory = t.category;
            y += 5;
            doc.setFontSize(14);
            doc.setFont(undefined, 'bold');
            doc.text(currentCategory || 'Sonstige', 15, y);
            y += 3;
            doc.setDrawColor(200, 168, 124);
            doc.line(15, y, 195, y);
            y += 8;
            doc.setFont(undefined, 'normal');
        }

        doc.setFontSize(11);
        doc.text(t.name, 15, y);
        const priceStr = formatCurrency(t.price || 0);
        doc.text(priceStr, 195, y, { align: 'right' });
        if (t.duration) {
            doc.setFontSize(9);
            doc.setTextColor(120);
            doc.text(`${t.duration} Min.`, 15, y + 5);
            doc.setTextColor(0);
        }
        y += t.duration ? 12 : 8;
    });

    doc.setFontSize(8);
    doc.setTextColor(150);
    doc.text('Skinconcept Hagner | Morbach | ' + new Date().toLocaleDateString('de-DE'), 105, 290, { align: 'center' });

    doc.save('Skinconcept_Preisliste.pdf');
    showToast('PDF heruntergeladen', 'success');
}

// ============ INIT ============
document.addEventListener('DOMContentLoaded', () => {
    loadTreatments();
    loadProducts();
});
</script>

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
</body>
</html>
